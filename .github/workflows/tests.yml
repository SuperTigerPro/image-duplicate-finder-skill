name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install full image test dependencies
        run: python -m pip install -r requirements-similar.txt
      - name: Run all regression tests
        run: python -m unittest discover -s tests -v
      - name: Check syntax
        run: python -m compileall -q scripts tests
  model:
    name: Optional model and SSH protocol contracts / Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU inference and stdio test dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-copynce.txt 'mcp>=1.20,<2' faiss-cpu==1.11.0.post1
      - name: Run regression tests without weights or live servers
        run: python -m unittest discover -s tests -v
      - name: Inspect public source allowlist
        run: python scripts/check_public_files.py --working-tree
